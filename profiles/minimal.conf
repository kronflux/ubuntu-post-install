# minimal profile - most aggressive. Applies the server and desktop
# catalogs, removes every optional package, pins removals, encrypts DNS.

remove_lxd=true
remove_snapd=true
disable_telemetry=true
remove_cloudinit=true
remove_avahi=true
remove_pro_client=true
pin_removed=true
clean_motd=true
harden_firewall=true
harden_ssh=true
harden_kernel=true
encrypt_dns=true
enable_unattended_upgrades=true
install_fail2ban=true
tune_performance=true
cap_journald=true
extra_packages=
